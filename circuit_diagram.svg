<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="480" fill="#ffffff"/>

  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">ESP32-S3  ↔  0.96" SSD1306 OLED (I2C)</text>

  <!-- ESP32-S3 board -->
  <rect x="70" y="90" width="220" height="300" rx="10" fill="#1f6f43" stroke="#0d3d24" stroke-width="2"/>
  <text x="180" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ESP32-S3</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#d9f2e3">DevKitC-1</text>

  <!-- ESP32-S3 pins -->
  <g font-size="13" fill="#ffffff">
    <rect x="270" y="185" width="20" height="14" fill="#0d3d24"/>
    <text x="265" y="196" text-anchor="end">3V3</text>

    <rect x="270" y="225" width="20" height="14" fill="#0d3d24"/>
    <text x="265" y="236" text-anchor="end">GND</text>

    <rect x="270" y="265" width="20" height="14" fill="#0d3d24"/>
    <text x="265" y="276" text-anchor="end">GPIO 8 (SDA)</text>

    <rect x="270" y="305" width="20" height="14" fill="#0d3d24"/>
    <text x="265" y="316" text-anchor="end">GPIO 9 (SCL)</text>
  </g>

  <!-- OLED module -->
  <rect x="510" y="150" width="220" height="180" rx="10" fill="#111111" stroke="#000000" stroke-width="2"/>
  <rect x="530" y="168" width="180" height="90" fill="#0a2a4a" stroke="#3a6ea5" stroke-width="1"/>
  <text x="620" y="215" text-anchor="middle" font-size="12" fill="#7fd0ff">0.96" OLED</text>
  <text x="620" y="232" text-anchor="middle" font-size="11" fill="#7fd0ff">128 x 64  SSD1306</text>

  <!-- OLED pins -->
  <g font-size="13" fill="#ffffff">
    <rect x="500" y="185" width="20" height="14" fill="#333333"/>
    <text x="525" y="196" text-anchor="start">VCC</text>

    <rect x="500" y="225" width="20" height="14" fill="#333333"/>
    <text x="525" y="236" text-anchor="start">GND</text>

    <rect x="500" y="265" width="20" height="14" fill="#333333"/>
    <text x="525" y="276" text-anchor="start">SDA</text>

    <rect x="500" y="305" width="20" height="14" fill="#333333"/>
    <text x="525" y="316" text-anchor="start">SCL</text>
  </g>

  <!-- Wires -->
  <g stroke-width="3" fill="none">
    <path d="M290 192 L500 192" stroke="#e53935"/>
    <path d="M290 232 L500 232" stroke="#424242"/>
    <path d="M290 272 L500 272" stroke="#1e88e5"/>
    <path d="M290 312 L500 312" stroke="#fdd835"/>
  </g>

  <!-- Wire labels -->
  <g font-size="12" fill="#333333">
    <text x="395" y="185" text-anchor="middle">3V3 (red)</text>
    <text x="395" y="225" text-anchor="middle">GND (black)</text>
    <text x="395" y="265" text-anchor="middle">SDA (blue)</text>
    <text x="395" y="305" text-anchor="middle">SCL (yellow)</text>
  </g>

  <!-- Legend / note -->
  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#555555">
    If your OLED module uses different labeled pins, match by function: VCC→3V3, GND→GND, SDA→GPIO8, SCL→GPIO9
  </text>
  <text x="400" y="450" text-anchor="middle" font-size="12" fill="#555555">
    I2C address is usually 0x3C (some modules use 0x3D)
  </text>
</svg>
